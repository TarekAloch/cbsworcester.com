site:
  name: 'Complete Billing Solutions'
  site: 'https://cbsworcester.com'
  base: '/'
  trailingSlash: false

metadata:
  title:
    default: 'Complete Billing Solutions | Medical Billing for Mental Health Providers'
    template: '%s | Complete Billing Solutions'
  description: "Worcester's premier medical billing service for mental health providers. 20+ years of expertise delivering industry-leading 96-98% collection rates. Free consultation."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Complete Billing Solutions'
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: 'website'
  author: 'Tarek Aloch'

contact:
  email: 'bashar@cbsworcester.com'

keywords:
  - medical billing
  - mental health billing
  - healthcare billing
  - Worcester MA
  - billing services
  - TotalMD
  - insurance claims
  - 96% collection rate

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
